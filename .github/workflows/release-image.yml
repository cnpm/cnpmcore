name: Create and publish a Docker image

on:
  workflow_dispatch:
  pull_request:
    branches: [master]

concurrency:
  group: build-and-push-image-${{ github.workflow }}-#${{ github.event.pull_request.number || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian, alpine]
    env:
      IMAGE_VARIANT: ${{ matrix.image }}

    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: cnpmcore
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis
        ports:
          - 6379:6379

    steps:
      - name: Checkout repository
        uses: taiki-e/checkout-action@v1

      # Refresh unlocked dependencies daily while reusing layers between runs.
      - name: Set cache date
        id: cache
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - parallel:
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v4
          - name: Prepare database
            run: CNPMCORE_TEST_WORKERS=0 CNPMCORE_DATABASE_NAME=cnpmcore bash ./prepare-database-mysql.sh

      - name: Build ${{ matrix.image }} image for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          load: true
          tags: cnpmcore:test-${{ matrix.image }}
          cache-from: type=gha,scope=cnpmcore-${{ matrix.image }}-${{ steps.cache.outputs.date }}
          cache-to: type=gha,mode=max,scope=cnpmcore-${{ matrix.image }}-${{ steps.cache.outputs.date }}

      - name: Verify ${{ matrix.image }} image
        run: |
          docker run -d --rm --name "cnpmcore-$IMAGE_VARIANT" \
            --network host \
            -e NODE_ENV=production \
            -e EGG_SERVER_ENV=prod \
            -e CNPMCORE_CONFIG_REGISTRY=http://localhost:7001 \
            -e CNPMCORE_DATABASE_TYPE=MySQL \
            -e CNPMCORE_DATABASE_HOST=127.0.0.1 \
            -e CNPMCORE_DATABASE_PORT=3306 \
            -e CNPMCORE_DATABASE_NAME=cnpmcore \
            -e CNPMCORE_DATABASE_USER=root \
            -e CNPMCORE_DATABASE_PASSWORD= \
            -e CNPMCORE_REDIS_HOST=127.0.0.1 \
            -e CNPMCORE_REDIS_PORT=6379 \
            -e CNPMCORE_REDIS_DB=0 \
            -e CNPMCORE_NFS_TYPE= \
            -e CNPMCORE_FORCE_LOCAL_FS=true \
            "cnpmcore:test-$IMAGE_VARIANT"
          bash .docker/health-check.sh "cnpmcore-$IMAGE_VARIANT"

  # Keep the existing check name and require both images to pass before publishing.
  build-and-push-image:
    if: ${{ always() }}
    needs: build-and-test-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check image tests
        env:
          TEST_RESULT: ${{ needs.build-and-test-image.result }}
        run: test "$TEST_RESULT" = success

      - name: Checkout repository
        if: success() && !cancelled() && github.event_name == 'workflow_dispatch'
        uses: taiki-e/checkout-action@v1

      - name: Log in to the Container registry
        if: success() && !cancelled() && github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: success() && !cancelled() && github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: success() && !cancelled() && github.event_name == 'workflow_dispatch'
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        if: success() && !cancelled() && github.event_name == 'workflow_dispatch'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Set cache date
        if: success() && !cancelled() && github.event_name == 'workflow_dispatch'
        id: cache
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        id: push
        if: success() && !cancelled() && github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/debian/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=cnpmcore-debian-${{ steps.cache.outputs.date }}
            type=gha,scope=cnpmcore-debian-release-${{ steps.cache.outputs.date }}
          cache-to: type=gha,mode=max,scope=cnpmcore-debian-release-${{ steps.cache.outputs.date }}

      - name: Generate artifact attestation
        if: success() && !cancelled() && github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
